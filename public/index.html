<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="每天自动更新的 AI 新闻：开发者观点、公司动态、热门新产品、热门论文，放在一个温暖房间里的老电视上播放。">
<style>body{margin:0}</style>
<title>AI 电台小屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
/* Layout: full-bleed 3D room; all news lives on the TV screen inside the scene. HUD is only a brand line, a hint and a control dock. Single warm evening look by choice. */
:root {
  --bg: #17110c;
  --panel: rgba(30, 22, 16, 0.8);
  --panel-edge: rgba(244, 196, 138, 0.2);
  --fg: #f3e7d5;
  --muted: #b8a188;
  --amber: #f2a44b;
  --c-kol: #e0955a;
  --c-co: #d06a58;
  --c-prod: #9dbb72;
  --c-paper: #6fb2a1;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#stage canvas.pointing { cursor: pointer; }
#stage canvas.dragging { cursor: grabbing; }

.hud { position: fixed; inset: 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.bar {
  position: absolute; left: 0; right: 0; top: 0; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: linear-gradient(to bottom, rgba(23,17,12,.7), rgba(23,17,12,0));
  transition: opacity .6s ease;
}
.bar.dim { opacity: .35; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand .name { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; letter-spacing: .04em; }
.brand .date { font-family: var(--f-mono); font-size: .8rem; color: var(--amber); letter-spacing: .06em; }
.tag { font-size: .72rem; letter-spacing: .12em; color: var(--muted); border: 1px solid var(--panel-edge); border-radius: 999px; padding: 4px 10px; }

.dock {
  position: absolute; left: 0; right: 0; margin-inline: auto; width: max-content; max-width: calc(100vw - 32px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 16px; padding: 8px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
.sep { width: 1px; align-self: stretch; background: var(--panel-edge); }
button, .btn {
  font: inherit; text-decoration: none; font-size: .8rem; color: var(--fg); background: rgba(255,255,255,.04);
  border: 1px solid var(--panel-edge); border-radius: 10px; padding: 7px 11px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: background .2s, border-color .2s;
}
button:hover, .btn:hover { background: rgba(242,164,75,.12); border-color: rgba(242,164,75,.45); }
button:focus-visible, .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: default; }
button.on { background: rgba(242,164,75,.18); border-color: var(--amber); }
button.primary { background: var(--amber); color: #2a1a0c; border-color: var(--amber); font-weight: 500; }
button.primary:hover { background: #f7b666; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip .b { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); }
.chip.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }

.hint {
  position: absolute; left: 0; right: 0; margin-inline: auto; width: max-content; max-width: calc(100vw - 32px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
  font-size: .76rem; color: var(--muted); letter-spacing: .06em; text-align: center; pointer-events: none;
  text-shadow: 0 1px 6px rgba(0,0,0,.7);
}
.tip {
  position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--panel-edge);
  border-radius: 10px; padding: 10px 12px; width: 230px; font-size: .78rem; line-height: 1.55;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.tip strong { display: block; font-family: var(--f-display); font-size: .9rem; margin-bottom: 4px; }
.tip .d { font-family: var(--f-mono); color: var(--amber); font-size: .72rem; }
.tip .counts { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; color: var(--muted); }
.tip .counts span { display: inline-flex; align-items: center; gap: 4px; }
.tip .counts i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.tip .big { color: var(--amber); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 720px) {
  .chip .b { display: none; }
  .sep { display: none; }
  .brand .name { font-size: 1.1rem; }
  .hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); }
}
@media (prefers-reduced-motion: reduce) { button, .bar { transition: none; } }
</style>

</head>
<body>
<div id="stage"></div>

<div class="hud">
  <header class="bar" id="bar">
    <div class="brand"><span class="name">AI 电台小屋</span><span class="date" id="dateLabel"></span></div>
    <span class="tag" id="tag">示例数据</span>
  </header>

  <div class="hint" id="hint"></div>
  <div class="tip" id="tip" hidden></div>
  <div class="sr" id="live" aria-live="polite"></div>

  <nav class="dock" aria-label="控制">
    <div class="group" id="roomCtrls">
      <button id="btnWatch" class="primary">走近看今日新闻</button>
      <button id="btnShelfA">转身看书柜</button>
    </div>
    <div class="group" id="tvCtrls" hidden>
      <button id="btnPrev" aria-label="上一条">‹ 上一条</button>
      <div class="group" id="chips"></div>
      <button id="btnNext" aria-label="下一条">下一条 ›</button>
      <a id="btnOpen" class="btn" target="_blank" rel="noopener" hidden>打开原文 ↗</a>
      <span class="sep"></span>
      <button id="btnBack">退后一步</button>
    </div>
    <div class="group" id="shelfCtrls" hidden>
      <button id="btnTurnBack">转回去</button>
    </div>
    <div class="group">
      <button id="btnToday" class="primary" hidden>回到今天</button>
      <button id="btnSound" aria-pressed="false">音乐：关</button>
    </div>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(async () => {
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V3 = THREE.Vector3;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(20260929);
const pick = arr => arr[Math.floor(rng() * arr.length)];

/* ---------- Categories = radio bands ---------- */
const css = getComputedStyle(document.documentElement);
const CATS = [
  { id:'kol',   name:'开发者观点', band:'FM',  color: css.getPropertyValue('--c-kol').trim(),   fmt: x => 'FM ' + (88 + x*20).toFixed(1) + ' MHz', src:'X · 示例账号' },
  { id:'co',    name:'公司动态',   band:'AM',  color: css.getPropertyValue('--c-co').trim(),    fmt: x => 'AM ' + Math.round(530 + x*1070) + ' kHz', src:'官方新闻室 + 媒体 · 示例' },
  { id:'prod',  name:'热门新产品', band:'SW1', color: css.getPropertyValue('--c-prod').trim(),  fmt: x => 'SW1 ' + (5.90 + x*1.4).toFixed(2) + ' MHz', src:'Product Hunt / GitHub · 示例' },
  { id:'paper', name:'热门论文',   band:'SW2', color: css.getPropertyValue('--c-paper').trim(), fmt: x => 'SW2 ' + (9.40 + x*2.7).toFixed(2) + ' MHz', src:'HF Daily Papers · 示例' },
];

/* ---------- Sample data: 90 days ---------- */
const TOPICS = ['Agent 框架','长上下文','代码补全','推理模型','开源权重','RAG','多模态','端侧模型','MCP 工具调用','语音模型','评测基准','小模型蒸馏'];
const NAMES = ['Loomly','Tidepad','Quillhouse','Mosaic Run','Harborline','Nimbus Code','Parrotdesk','Ledgerlight','Foxglove','Cinder'];
const LETTERS = 'ABCDEFGH';
const TPL = {
  kol: [
    T => `@示例开发者_${Math.floor(rng()*90+10)}：${T} 现在最缺的不是模型，是好的评测`,
    T => `@示例开发者_${Math.floor(rng()*90+10)}：用 ${T} 重写了一个小工具，一下午就上线了`,
    T => `@示例开发者_${Math.floor(rng()*90+10)}：大家对 ${T} 的期待有点过头了`,
    T => `@示例开发者_${Math.floor(rng()*90+10)}：${T} 的下一个战场是开发者体验`,
  ],
  co: [
    T => `示例公司 ${pick([...LETTERS])} 发布新一代 ${T} 能力`,
    () => `示例公司 ${pick([...LETTERS])} 宣布扩建推理算力集群`,
    () => `示例芯片厂 ${pick([...LETTERS])}：新款推理芯片开始出货`,
    T => `示例云厂商 ${pick([...LETTERS])} 上线 ${T} 托管服务`,
  ],
  prod: [
    T => `「${pick(NAMES)}」上线，主打 ${T}`,
    () => `「${pick(NAMES)}」开源，一周 GitHub 星标破万`,
    () => `「${pick(NAMES)}」登上 Product Hunt 当日榜首`,
  ],
  paper: [
    T => `${T} 的推理成本还能再降一半？`,
    T => `一种更简单的 ${T} 训练方法`,
    T => `重新审视 ${T} 的评测基准`,
  ],
};
const SUM = {
  kol: T => `示例推文：作者分享了在真实项目里使用${T}的体会，认为工具链成熟度比榜单分数更重要。上线后会以推文嵌入卡片呈现，并附原始链接。`,
  co: T => `示例新闻：官方博客与多家媒体同步报道，重点是${T}方向的产品化进度和价格调整。`,
  prod: T => `示例产品：同时出现在 Product Hunt、GitHub Trending 和开发者讨论里，跨平台热度较高，所以被收录。`,
  paper: T => `示例论文：来自示例大学实验室。一句话看点：用更少的计算量得到接近的效果，附开源代码。`,
};
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
const fmtDate = d => `${d.getMonth()+1}月${d.getDate()}日 ${WEEK[d.getDay()]}`;

function sampleDays() {
const DAYS = [];
const today = new Date(); today.setHours(12,0,0,0);
for (let i = 89; i >= 0; i--) {
  const date = new Date(today); date.setDate(today.getDate() - i);
  const big = rng() < 0.09;
  const items = {}; let total = 0; let best = null; const raw = {};
  CATS.forEach(c => {
    const n = Math.floor(rng()*5) + (big ? 3 : 1);
    raw[c.id] = n + Math.floor(rng()*6);
    total += raw[c.id];
    const shown = Math.min(5, n);
    items[c.id] = Array.from({length: shown}, () => {
      const T = pick(TOPICS);
      return { title: pick(TPL[c.id])(T), sum: SUM[c.id](T), heat: Math.floor(40 + rng()*59), topic: T };
    }).sort((a,b) => b.heat - a.heat);
    items[c.id].forEach(it => { if (!best || it.heat > best.heat) { best = it; best.cat = c.id; } });
  });
  const dominant = CATS.reduce((m, c) => raw[c.id] > raw[m.id] ? c : m, CATS[0]);
  DAYS.push({ date, items, raw, total, big, dominant, keyword: best.topic, head: best });
}
return DAYS;
}

/* ---------- Real data from the daily pipeline (public/data), sample data as a fallback ---------- */
const CAT_IDS = CATS.map(c => c.id);
async function loadDays() {
  try {
    const res = await fetch('data/index.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const idx = await res.json();
    if (!idx.days?.length) throw new Error('empty');
    return { live: true, updatedAt: idx.updatedAt, days: idx.days.map(d => {
      const raw = Object.fromEntries(CAT_IDS.map(id => [id, d.raw?.[id] ?? 0]));
      return {
        dateStr: d.date, date: new Date(d.date + 'T12:00:00'), raw, total: d.total ?? 0, big: !!d.big,
        dominant: CATS.reduce((m, c) => raw[c.id] > raw[m.id] ? c : m, CATS[0]),
        keyword: d.keyword || 'AI', head: { title: d.head?.title || '' }, items: null,
      };
    }) };
  } catch (e) { return { live: false, days: sampleDays() }; }
}
async function ensureItems(day) {
  if (day.items) return day.items;
  try {
    const res = await fetch(`data/days/${day.dateStr}.json`, { cache: 'no-store' });
    const j = await res.json();
    day.items = Object.fromEntries(CAT_IDS.map(id => [id, j.items?.[id] ?? []]));
  } catch (e) { day.items = Object.fromEntries(CAT_IDS.map(id => [id, []])); }
  return day.items;
}
const LOADED = await loadDays();
const LIVE = LOADED.live;
const DAYS = LOADED.days;
const TODAY = DAYS[DAYS.length - 1];
const londonToday = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const latestLabel = day => day !== TODAY ? '回放' : (!LIVE || day.dateStr === londonToday ? '今天' : '最新');

/* ---------- Renderer / scene ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const cvs = renderer.domElement;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const col = c => new THREE.Color(c).convertSRGBToLinear();
const hdr = (r, g, b) => new THREE.Color(r, g, b);
scene.background = col('#1c1209');
scene.fog = new THREE.FogExp2(col('#3a2410'), .075);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 50);
camera.rotation.order = 'YXZ';

/* ---------- Procedural textures (no downloads) ---------- */
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = MAX_ANISO;
  return t;
}
function speckle(x, w, h, n, alpha) {
  for (let i = 0; i < n; i++) {
    x.fillStyle = rng() < .5 ? `rgba(0,0,0,${alpha * rng()})` : `rgba(255,235,200,${alpha * rng() * .6})`;
    x.fillRect(rng() * w, rng() * h, 1 + rng() * 2, 1 + rng() * 2);
  }
}
function grainLines(x, w, h, n, dark) {
  for (let i = 0; i < n; i++) {
    const y = rng() * h, amp = 1 + rng() * 5, f = .003 + rng() * .012, ph = rng() * 6;
    x.strokeStyle = rng() < .7 ? dark : 'rgba(255,225,180,.5)';
    x.globalAlpha = .05 + rng() * .16; x.lineWidth = .5 + rng() * 2.2;
    x.beginPath();
    for (let xx = 0; xx <= w; xx += 8) { const yy = y + Math.sin(xx * f + ph) * amp + Math.sin(xx * .05 + i) * .6; xx ? x.lineTo(xx, yy) : x.moveTo(xx, yy); }
    x.stroke();
  }
  x.globalAlpha = 1;
}
const woodTex = (base, dark) => canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = base; x.fillRect(0, 0, w, h); grainLines(x, w, h, 190, dark); speckle(x, w, h, 2500, .12);
});
const floorTex = canvasTex(1024, 1024, (x, w, h) => {
  const rowH = 128;
  for (let r = 0; r < h / rowH; r++) {
    let xx = -rng() * 300;
    while (xx < w) {
      const len = 280 + rng() * 420, l = 30 + rng() * 12;
      x.fillStyle = `hsl(${24 + rng() * 6}, ${38 + rng() * 10}%, ${l}%)`; x.fillRect(xx, r * rowH, len, rowH);
      x.save(); x.beginPath(); x.rect(xx, r * rowH, len, rowH); x.clip(); x.translate(0, r * rowH);
      grainLines(x, w, rowH, 26, 'rgba(40,20,8,1)'); x.restore();
      x.fillStyle = 'rgba(20,10,4,.75)'; x.fillRect(xx, r * rowH, 3, rowH);
      xx += len;
    }
    x.fillStyle = 'rgba(20,10,4,.8)'; x.fillRect(0, r * rowH, w, 3);
  }
  speckle(x, w, h, 9000, .12);
});
floorTex.repeat.set(3, 3);
const wallTex = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#a68560'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < w; i += 32) { x.fillStyle = i % 64 ? 'rgba(255,230,190,.06)' : 'rgba(60,35,15,.07)'; x.fillRect(i, 0, 12, h); }
  for (let yy = 16; yy < h; yy += 48) for (let xx = 22; xx < w; xx += 64) { x.fillStyle = 'rgba(90,55,25,.12)'; x.beginPath(); x.arc(xx + (yy % 96 ? 32 : 0), yy, 3, 0, 7); x.fill(); }
  for (let i = 0; i < 9; i++) { const gx = rng() * w, gy = rng() * h, r = 40 + rng() * 120; const g = x.createRadialGradient(gx, gy, 0, gx, gy, r); g.addColorStop(0, 'rgba(70,40,15,.12)'); g.addColorStop(1, 'rgba(70,40,15,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h); }
  speckle(x, w, h, 5000, .08);
});
const plaidTex = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#f7e6c4'; x.fillRect(0, 0, w, h);
  [[0, 10], [26, 3], [34, 3], [128, 8], [150, 2]].forEach(([p, s]) => {
    x.fillStyle = 'rgba(165,112,55,.22)'; x.fillRect(0, p, w, s); x.fillRect(p, 0, s, h);
  });
  for (let i = 0; i < w; i += 2) { x.fillStyle = 'rgba(120,80,40,.04)'; x.fillRect(i, 0, 1, h); }
});
plaidTex.repeat.set(2.2, 3);
const skyTex = canvasTex(256, 256, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#fff6dc'); g.addColorStop(.6, '#ffd898'); g.addColorStop(1, '#e8a860');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 14; i++) { const gx = rng() * w, gy = h * .55 + rng() * h * .5, r = 20 + rng() * 50; const rg = x.createRadialGradient(gx, gy, 0, gx, gy, r); rg.addColorStop(0, 'rgba(150,95,40,.35)'); rg.addColorStop(1, 'rgba(150,95,40,0)'); x.fillStyle = rg; x.fillRect(0, 0, w, h); }
});

/* ---------- Geometry helpers ---------- */
function boxGeo(w, h, d, s) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) { const i = f * 4 + k; uv.setXY(i, uv.getX(i) * dims[f][0] / s, uv.getY(i) * dims[f][1] / s); }
  return g;
}

  if (power < 1 && now > powerStart) power = Math.min(1, (now - powerStart) / 1100);
  staticAmt = Math.max(0, staticAmt - dt * 2.4); noiseBurst = Math.max(0, noiseBurst - dt * 2.2);
  crtMat.uniforms.uPower.value = ease(power); crtMat.uniforms.uStatic.value = staticAmt;
  crtMat.uniforms.uTime.value = REDUCE ? 0 : elapsed;
  if (view !== 'shelf' || trans) { if (elapsed - lastDraw > 1 / 30) { drawScreen(elapsed); lastDraw = elapsed; } }
  const flick = REDUCE ? 1 : .9 + Math.random() * .1;
  tvLight.intensity = (1.1 + staticAmt * .8) * ease(power) * flick;
  led.visible = power > 0;
  const target = soundOn ? (view === 'tv' ? .38 : .6) : 0;
  musicVol = lerp(musicVol, target, Math.min(1, dt * (soundOn ? .8 : 2.5)));
  if (!music.paused) { music.volume = clamp(musicVol, 0, 1); if (!soundOn && musicVol < .01) music.pause(); }
  if (bloomPass) bloomPass.strength = lerp(bloomPass.strength, view === 'tv' && !trans ? .32 : .8, Math.min(1, dt * 2));

  /* camera */
  par.x = lerp(par.x, par.tx, Math.min(1, dt * 3)); par.y = lerp(par.y, par.ty, Math.min(1, dt * 3));
  const pk = view === 'tv' ? .12 : 1;
  const breathe = REDUCE ? 0 : Math.sin(elapsed * .9) * .004 * pk;
  const pxYaw = REDUCE ? 0 : -par.x * .035 * pk, pxPitch = REDUCE ? 0 : -par.y * .02 * pk;
  if (trans) {
    trans.t = Math.min(1, trans.t + dt / trans.dur);
    const e = ease(trans.t), to = pose(trans.to), f = trans.from;
    camera.position.lerpVectors(f.p, to.p, e);
    camera.rotation.y = lerp(f.yaw, to.yaw, e);
    camera.rotation.x = lerp(f.pitch, to.pitch, e);
    if (!REDUCE) {
      const env = Math.sin(Math.PI * trans.t);
      if (trans.kind === 'walk' || trans.kind === 'back') {
        const steps = trans.kind === 'walk' ? 4 : 2, ph = trans.t * Math.PI * steps;
        camera.position.y += Math.abs(Math.sin(ph)) * .028 * env - .01 * env;
        camera.rotation.z = Math.sin(ph) * .006 * env;
        camera.rotation.x -= Math.abs(Math.sin(ph)) * .01 * env;
      } else {
        camera.position.y += env * .05; camera.rotation.x -= env * .05;
        camera.rotation.z = (trans.to === 'shelf' ? 1 : -1) * env * .02;
      }
    }
    if (trans.t >= 1) { trans = null; camera.rotation.z = 0; }
  } else {
    const p = pose(view);
    camera.position.lerp(new V3(p.p.x, p.p.y + breathe, p.p.z), Math.min(1, dt * 6));
    camera.rotation.y = lerp(camera.rotation.y, p.yaw + pxYaw, Math.min(1, dt * 5));
    camera.rotation.x = lerp(camera.rotation.x, p.pitch + pxPitch, Math.min(1, dt * 5));
    camera.rotation.z = 0;
  }

  /* books */
  books.forEach(b => { const u = b.userData; if (u.flying || u.docked) return; u.out = lerp(u.out, u.outTarget, Math.min(1, dt * 10)); b.position.x = u.home.x + u.out; });
  flights = flights.filter(f => {
    f.t = Math.min(1, f.t + dt / f.dur);
    const e = ease(f.t), a = 1 - e;
    f.b.position.set(a * a * f.from.x + 2 * a * e * f.ctrl.x + e * e * f.to.x, a * a * f.from.y + 2 * a * e * f.ctrl.y + e * e * f.to.y, a * a * f.from.z + 2 * a * e * f.ctrl.z + e * e * f.to.z);
    f.b.rotation.y = lerp(f.fromRot, f.toRot, e); f.b.rotation.z = Math.sin(Math.PI * e) * .25;
    if (f.t >= 1) { f.b.rotation.z = 0; f.done(); return false; }
    return true;
  });

  /* dust, curtains, beams */
  if (!REDUCE) {
    const a = dustGeo.attributes.position.array;
    for (let i = 0; i < dustN; i++) { a[i * 3 + 1] += Math.sin(elapsed * .3 + i) * .0004; a[i * 3] += .00015; if (a[i * 3] > 3.5) a[i * 3] = -1; }
    dustGeo.attributes.position.needsUpdate = true;
    curtains.forEach(c => {
      const p = c.g.attributes.position.array, b = c.base;
      for (let i = 0; i < p.length; i += 3) { const x = b[i], y = b[i + 1], hang = (1 - y) * .5; p[i + 2] = Math.sin(x * c.folds * 3 + c.phase) * .035 + Math.sin(elapsed * .7 + x * 2 + c.phase) * .018 * hang; }
      c.g.attributes.position.needsUpdate = true;
    });
  }
  beamMat.uniforms.uTime.value = REDUCE ? 0 : elapsed;
  if (composer) { gradePass.uniforms.uTime.value = REDUCE ? 0 : elapsed; composer.render(); }
  else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- Boot ---------- */
resize();
$('tag').textContent = LIVE ? `每天自动更新 · ${new Date(LOADED.updatedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}` : '示例数据';
setDay(TODAY); staticAmt = 0; noiseBurst = 0;
const p0 = pose('room'); camera.position.copy(p0.p); camera.rotation.set(p0.pitch, p0.yaw, 0);
updateUi();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => books.forEach(b => b.material[0].map.userData.draw()));
requestAnimationFrame(frame);
})();
</script>

</body>
