name: 每日更新 AI 新闻

on:
  schedule:
    # 每天 UTC 5:20（伦敦夏令时 6:20，冬令时 5:20）
    - cron: '20 5 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动点"Run workflow"

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 抓取、判断并写入今天的数据
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOCIALDATA_API_KEY: ${{ secrets.SOCIALDATA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run daily

      - name: 提交数据（Vercel 会自动重新部署）
        run: |
          git config user.name "ai-radio-room-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "没有新数据"
          else
            git commit -m "data: $(TZ=Europe/London date +%F)"
            git push
          fi
